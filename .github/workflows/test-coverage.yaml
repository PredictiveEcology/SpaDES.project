# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    # Named rather than `secrets: inherit`: inherit passes secrets by matching
    # name, and this repo's Drive credential is called
    # ELIOT_GOOGLE_AUTHENTICATION, so the shared workflow's GOOGLEDRIVE_AUTH
    # arrived empty and every Drive-backed test skipped.
    secrets:
      GOOGLEDRIVE_AUTH: ${{ secrets.ELIOT_GOOGLE_AUTHENTICATION }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      extra-packages: |
        fastshp=?ignore
        NLMR=?ignore
        PredictiveEcology/Require@development
      post-install: |
        pak::pkg_install("ropensci/NLMR")
        tryCatch(pak::pkg_install("s-u/fastshp"), error = function(e) message("fastshp install failed (likely compilation issue): ", conditionMessage(e)))
