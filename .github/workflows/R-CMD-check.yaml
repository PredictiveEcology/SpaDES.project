# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

name: R-CMD-check

# No `concurrency:` here on purpose. The reusable workflow this calls sets its
# own group, and inside a reusable workflow `github.workflow` resolves to the
# CALLER's name -- so a caller-level group with the same expression produces the
# identical key and the child waits on a group its own parent holds:
#   "Canceling since a deadlock was detected for concurrency group ...
#    between a top level workflow and 'R-CMD-check'"
# The shared workflow's version is also the better one: it cancels superseded
# PR runs but lets a default-branch push run to completion.

jobs:
  R-CMD-check:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    # See test-coverage.yaml: inherit the org-level Drive credential.
    secrets: inherit
    with:
      extra-packages: |
        any::rematch2
        fastshp=?ignore
        NLMR=?ignore
        PredictiveEcology/Require@development
      post-install: |
        pak::pkg_install("ropensci/NLMR")
        tryCatch(remotes::install_github("s-u/fastshp"), error = function(e) message("fastshp install failed (likely compilation issue): ", conditionMessage(e)))
