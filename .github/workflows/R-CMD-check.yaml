# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    # See test-coverage.yaml: inherit the org-level Drive credential.
    secrets: inherit
    with:
      # Deep matrix legs pinned to exact R versions, not oldrel-N. The oldrel
      # ladder is platform-dependent and not monotone: on ubuntu-latest
      # oldrel-4 and oldrel-5 both resolve to 4.1.3 and R 4.2 is unreachable
      # entirely; on ubuntu-22.04 oldrel-4 gives R 3.6.3. It also shifts every
      # time R releases. DESCRIPTION declares R (>= 4.3), so 4.3 is the
      # version this matrix has to prove -- oldrel-2 stopped at 4.4.
      extra-config: |
        [{"config": {"os": "ubuntu-latest",  "nosuggests": false, "r": "4.4"}},
         {"config": {"os": "ubuntu-latest",  "nosuggests": false, "r": "4.3"}}]
      extra-packages: |
        any::rematch2
        fastshp=?ignore
        NLMR=?ignore
        PredictiveEcology/Require@development
      post-install: |
        pak::pkg_install("ropensci/NLMR")
        tryCatch(remotes::install_github("s-u/fastshp"), error = function(e) message("fastshp install failed (likely compilation issue): ", conditionMessage(e)))
