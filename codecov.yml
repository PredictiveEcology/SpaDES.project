codecov:
  ## This repo's default branch is `main`; without this Codecov falls back to
  ## `master`, which does not exist here, so the repo total is computed from
  ## nothing and reads far below the real figure.
  branch: main

comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLEDRIVE_AUTH: ${{ secrets.ELIOT_GOOGLE_AUTHENTICATION }}
      CODECOV_TOKEN: 499b0c9f-9687-46ef-bdc0-21b061648a4a


