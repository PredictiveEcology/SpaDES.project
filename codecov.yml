comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

# `flags` are declared so the partial upload from tmux-coverage.yaml merges
# cleanly with the full upload from test-coverage.yaml for the same commit.
flags:
  tmux:
    paths:
      - R/
    carryforward: true


