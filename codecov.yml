codecov:
  ## This repo's default branch is `main`; without this Codecov falls back to
  ## `master`, which does not exist here, so the repo total is computed from
  ## nothing and reads far below the real figure.
  branch: main

comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

# `flags` are declared so the partial upload from tmux-coverage.yaml merges
# cleanly with the full upload from test-coverage.yaml for the same commit.
flags:
  tmux:
    paths:
      - R/
    carryforward: true


